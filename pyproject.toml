[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trc-research"
version = "0.2.0"
description = "Offline temporal representation data contracts and audit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
trc = "trc.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
analysis = ["pyarrow>=14", "matplotlib>=3.9"]
review = ["pyarrow>=14", "av>=14", "Pillow>=10", "PyYAML>=6"]

[tool.setuptools]
license-files = ["third_party/openpi/LICENSE", "third_party/openpi/NOTICE.md"]

[tool.setuptools.packages.find]
where = ["src"]
